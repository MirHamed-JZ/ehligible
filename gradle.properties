#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
# iOS targets can only be compiled on macOS (CI); skip them quietly elsewhere.
kotlin.native.ignoreDisabledTargets=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#App
# Every Play upload needs a higher version code: bump both lines together.
ehligible.versionName=1.0.2
ehligible.versionCode=3
# Staged Play launch: v1.0 ships without ACCESS_BACKGROUND_LOCATION (see docs/SPEC.md); v1.1 turns it on
# (docs/publishing/background-location.md).
ehligible.backgroundLocation=false
